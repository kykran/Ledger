<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Your program</title>
  <meta name="theme-color" content="#f5f0e6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101113" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
  <style>
    :root{--bg:#f5f0e6;--surface:#fffcf6;--surface2:#eee7da;--ink:#1d1a14;--ink2:#4f493d;--muted:#877f6f;--line:#e2d9c8;--accent:#1f4c9c;--accent-ink:#fff;--good:#1b7a4a;--good-bg:#e0f0e5;--warn:#94600d}
    @media (prefers-color-scheme: dark){:root{--bg:#101113;--surface:#18191c;--surface2:#212327;--ink:#edebe5;--ink2:#b5b2a9;--muted:#827f78;--line:#2b2d32;--accent:#8eaeff;--accent-ink:#0b1531;--good:#5fd497;--good-bg:#13291d;--warn:#e8b45c}}
    *{box-sizing:border-box} html,body{background:var(--bg);margin:0}
    body{color:var(--ink);font:15px/1.5 Onest,system-ui,sans-serif;font-variant-numeric:tabular-nums;padding:22px 14px 60px;-webkit-font-smoothing:antialiased}
    main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
    button,input,select{font:inherit;color:inherit}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
    h1{font-size:23px;margin:0;letter-spacing:-.02em} .sub{color:var(--muted);font-size:13px;margin:2px 0 0}
    h2{font-size:16px;margin:0} h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0;font-weight:600}
    .muted{color:var(--muted)} .small{font-size:13px}
    .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none} .tabs::-webkit-scrollbar{display:none}
    .tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
    .tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
    .seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
    .seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer}
    .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
    .sess-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
    .badge{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
    .badge.done{background:var(--good-bg);color:var(--good)}
    .ex{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
    .ex:first-of-type{border-top:0;padding-top:0}
    .ex-h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
    .ex-name{font-weight:600;border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--ink);display:flex;gap:8px;align-items:center}
    .ex-name .play{font-size:11px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:20px;padding:1px 8px;white-space:nowrap}
    .grp{font-size:11.5px;font-weight:700;background:var(--surface2);color:var(--ink2);border-radius:6px;padding:1px 6px}
    .rx{font-size:14px;color:var(--ink2);white-space:nowrap;text-align:right}
    .note{font-size:13.5px;color:var(--ink2)}
    .detail{display:flex;flex-direction:column;gap:8px}
    .sets{display:flex;flex-direction:column;gap:6px}
    .set{display:grid;grid-template-columns:44px 1fr 1fr 44px;gap:6px;align-items:center}
    .set input[type=number]{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;width:100%;font-size:16px}
    .chk{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer}
    .chk[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--bg)}
    .chk svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
    .chk[aria-pressed="true"] svg{opacity:1}
    .btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
    .btn:disabled{opacity:.5}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .row input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-size:16px}
    select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
    .lbl{font-size:12px;color:var(--muted);font-weight:600}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9}
    footer{color:var(--muted);font-size:12px;text-align:center;margin-top:6px}
    .skel{height:120px;border-radius:16px;background:var(--surface2);animation:p 1.2s ease-in-out infinite alternate} @keyframes p{to{opacity:.5}}
    .empty{color:var(--muted);font-size:14px;text-align:center;padding:14px 0}
    .btn.wide{width:100%}
    .card.doing{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
    .strip{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;font-size:14px;cursor:pointer}
    .strip.warn b{color:var(--warn)}
    .sv{display:flex;flex-direction:column;gap:14px}
    .sv h2{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 4px;font-weight:600}
    .sv .card{gap:4px}
    .sv .big{font-size:52px;font-weight:700;line-height:1;letter-spacing:-.02em} .sv .of{color:var(--muted);font-size:15px;margin-left:6px}
    .sv .bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:12px 0 6px} .sv .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
    .sv .note{margin:0} .sv .warn{color:var(--warn)}
    .sv ul{list-style:none;margin:0;padding:0} .sv li{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)} .sv li:first-child{border-top:0}
    .sv li span:last-child{color:var(--muted)} .sv .empty{text-align:left;padding:0}
    .sv ul.num{margin-top:8px} .sv ul.num li span:first-child{display:flex;gap:12px;align-items:baseline}
    .sv .n{display:inline-block;min-width:26px;text-align:right;color:var(--muted);font-weight:600;font-size:13px}
    .sv li.bk span:first-child{color:var(--ink2)} .sv li.bk .n{color:var(--accent)}
    .sv .nextpk{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
    .due{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));vertical-align:middle;text-transform:none;letter-spacing:0}
    .due.paid{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
    .sv li.tap{padding:0} .sv li.tap button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 0;text-align:left;cursor:pointer;font:inherit;color:inherit}
    .sv li.tap button span:last-child{color:var(--muted);white-space:nowrap} .sv li.tap button:active{background:var(--surface2)}
    .sv li.tap button span:first-child{display:flex;gap:12px;align-items:baseline}
    .duecard{flex-direction:row;align-items:baseline;gap:10px;flex-wrap:wrap} .duecard b{color:var(--good)} .duecard.is-due b{color:var(--warn)}
    .duecard.is-due{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
    .card.studio{border-left:4px solid var(--accent)} .card.hw{border-left:4px solid var(--good)}
    .kind{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:-6px} .card.hw .kind{color:var(--good)}
    .linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
    body.wide main{max-width:1180px}
    .cal-step{display:flex;gap:6px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
    .cal-step .btn.sm{padding:5px 12px}
    .cal-key{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
    .cal-key i{display:inline-block;width:14px;height:10px;border-radius:3px;border:1.5px solid var(--accent);margin-left:6px} .cal-key i.k-h{border-style:dashed;border-color:var(--good)}
    .cal-wk{scroll-margin-top:52px;padding:12px;gap:10px} .cal-wk.now{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
    .cal-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap} .cal-h b{font-size:15px}
    .tag{font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
    .cal-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
    .cal-d{min-height:92px;border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:6px;background:var(--bg);min-width:0}
    .cal-d.past{opacity:.8} .cal-d.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
    .cal-dn{display:flex;align-items:baseline;gap:5px;font-size:12px;color:var(--muted)} .cal-dn b{font-size:15px;color:var(--ink)} .cal-d.today .cal-dn b{color:var(--accent)}
    .cal-s{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:3px;width:100%;border-radius:8px;padding:6px 7px;background:var(--surface);border:1.5px solid color-mix(in srgb,var(--accent) 55%,var(--line));font-size:12px;line-height:1.3;color:var(--ink)}
    .cal-s.hw{border-style:dashed;border-color:color-mix(in srgb,var(--good) 60%,var(--line))}
    .cal-s:hover,.cal-s:focus-visible{border-color:var(--accent);outline:none} .cal-s:focus-visible{box-shadow:0 0 0 2px var(--accent)}
    .cal-s.done{background:color-mix(in srgb,var(--good) 9%,var(--surface))} .cal-s.done i{font-style:normal;color:var(--good);font-weight:700;margin-right:4px}
    .cal-s.flat{cursor:default;opacity:.75}
    .cal-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cal-ex{display:flex;gap:5px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden}
    .cal-ex .gchip{min-width:22px;font-size:10px;padding:0 4px;flex:0 0 auto} .cal-n{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis} .cal-ex .muted{flex:0 0 auto}
    .cal-add{all:unset;box-sizing:border-box;cursor:pointer;font-size:12px;font-weight:600;color:var(--accent);border:1px dashed var(--line);border-radius:8px;padding:5px 7px;text-align:center;margin-top:auto}
    .cal-add:hover,.cal-add:focus-visible{border-color:var(--accent)}
    .cal-days.editing{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
    .cal-days.editing .cal-d.open{grid-column:span 3;padding:8px;border-color:var(--accent);box-shadow:0 10px 28px rgba(0,0,0,.22),0 0 0 1px var(--accent);background:var(--surface)}
    .cal-open{display:flex;flex-direction:column;gap:6px;min-width:0} .cal-open .card{padding:10px;border:0;box-shadow:none;margin:0}
    .cal-obar{display:flex;align-items:center;gap:6px;justify-content:flex-end} .cal-obar .small{margin-right:auto}
    .cal-left{display:flex;flex-wrap:wrap;gap:8px;align-items:center} .cal-left>.muted{flex:1 1 100%}
    .cal-left .cal-s{width:auto;min-width:170px;max-width:260px} .cal-left .cal-open{flex:1 1 100%;border:1px solid var(--accent);border-radius:12px;padding:8px}
    .logged{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 4px;font-size:13px;font-variant-numeric:tabular-nums} .logged span{padding:2px 8px;border-radius:6px;background:var(--good-bg);color:var(--good);font-weight:600}
    .seg.sm button{white-space:nowrap}
    @media (min-width:761px){ .cal-d:not(.has) .cal-add{border-color:transparent;color:var(--muted)} .cal-d:not(.has):hover .cal-add{border-color:var(--line);color:var(--accent)} .cal-d.has .cal-add{border-color:transparent;padding:2px} }
    .hist{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
    .hist:hover,.hist:focus-visible{border-color:var(--accent)} .hist b{flex:1;min-width:0} .hist-d{font-size:13px;color:var(--muted);min-width:92px}
    @media (max-width:760px){
      .cal-days{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:0 4px 4px;margin:0 -4px}
      .cal-d{flex:0 0 56px;scroll-snap-align:start;min-height:76px} .cal-d.has{flex-basis:172px}
      .cal-d.open{flex-basis:calc(100vw - 56px)} .cal-days.editing{display:flex}
      .cal-dn{flex-direction:column;gap:0;align-items:flex-start} .cal-d.has .cal-dn,.cal-d.open .cal-dn{flex-direction:row;gap:5px;align-items:baseline}
      .cal-d:not(.has) .cal-add{font-size:0;padding:4px 0} .cal-d:not(.has) .cal-add::before{content:"+";font-size:16px}
      .cal-key{display:none}
    }
    .eq{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
    .eq-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:13.5px}
    .eq-c,.eq-opts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    .chip{font:inherit;font-size:13px;min-height:34px;padding:5px 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
    .chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
    .note.swap{color:var(--accent);font-weight:600}
    .signin{gap:14px;margin-top:8vh;text-align:left}
    .code{font-size:34px;letter-spacing:.5em;text-align:center;padding:12px 10px 12px 26px;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;width:100%;font-weight:700}
    .code:focus{outline:none;border-color:var(--accent)}
    .warn{color:var(--warn)}
    .tip{flex-direction:row;align-items:center;flex-wrap:wrap;gap:6px 12px} .tip .note{flex:1;min-width:200px}
    .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:8}
    .sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));z-index:9;display:flex;flex-direction:column;gap:12px;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
    .reasons{display:flex;flex-direction:column;gap:6px}
    .reasons button{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 14px;text-align:left;font-weight:600;cursor:pointer}
    .reasons button[aria-checked="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--bg))}
    .ptop{display:flex;justify-content:space-between;align-items:center;gap:10px} .ptop h3{margin:0}
    .seg.sm{flex:none} .seg.sm button{padding:5px 12px;font-size:13px}
    .sug{display:flex;flex-direction:column;gap:0;max-height:46vh;overflow:auto}
    .sug-r{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)} .sug-r:first-child{border-top:0}
    .sug-n{flex:1;min-width:0;display:flex;flex-direction:column} .sug-r .btn.sm{padding:4px 9px}
    .sheet .row{flex-wrap:wrap} .btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
    textarea{font:inherit;color:inherit;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-size:16px;width:100%;resize:vertical}
  </style>
</head>
<body>
  <main id="m"><div class="skel"></div><div class="skel"></div></main>
  <script type="module" src="/src/program-page.js"></script>
</body>
</html>
